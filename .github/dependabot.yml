version: 2
updates:
  # CMS dependencies (Payload, Next.js, React)
  - package-ecosystem: "npm"
    directory: "/packages/cms"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # jsdom 30+ pulls an undici that needs Node 22+ (uses markAsUncloneable);
      # this project runs on Node 20 (Lambda + CI). Hold jsdom on the 29.x line
      # until the Node baseline moves to 22+.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # @types/node must match the deployed runtime (Lambda nodejs20.x).
      # Bump deliberately when the Node baseline moves, not via Dependabot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Installer infrastructure (Pulumi)
  - package-ecosystem: "npm"
    directory: "/packages/infra/pulumi/starter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "infrastructure"
    ignore:
      # Major provider upgrades change deployed customer infrastructure and
      # need a verified test deployment first. Upgrade deliberately, not via
      # Dependabot.
      - dependency-name: "@pulumi/aws"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
