version: 2
updates:
  # CMS dependencies (Payload, Next.js, React)
  - package-ecosystem: "npm"
    directory: "/packages/cms"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # jsdom 30+ pulls an undici that needs Node 22+ (uses markAsUncloneable);
      # this project runs on Node 20 (Lambda + CI). Hold jsdom on the 29.x line
      # until the Node baseline moves to 22+.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Installer infrastructure (Pulumi)
  - package-ecosystem: "npm"
    directory: "/packages/infra/pulumi/starter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "infrastructure"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
